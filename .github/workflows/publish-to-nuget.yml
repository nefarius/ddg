name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: nuget-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write # required for NuGet trusted publishing OIDC exchange
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build DevDriveGrow.csproj -c Release

      - name: Check CLI help
        run: dotnet run --project DevDriveGrow.csproj -c Release --no-build -- --help

      - name: Modify README.md for NuGet
        shell: pwsh
        run: |
          $path = Join-Path $PWD 'README.md'
          $text = [System.IO.File]::ReadAllText($path)
          $text = [regex]::Replace($text, '(?m)^# <img[^>\r\n]*>', '# ')
          $text = [regex]::Replace($text, '(?m)^<br clear="all" />\r?\n?', '')
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText($path, $text, $utf8NoBom)

      - name: Pack
        run: dotnet pack DevDriveGrow.csproj -c Release --no-build -o ./artifacts/nupkg

      - name: Verify package
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $packages = @(Get-ChildItem ./artifacts/nupkg -Filter 'Nefarius.Tools.DDG.*.nupkg')
          if ($packages.Count -ne 1) { throw "Expected exactly one nupkg, found $($packages.Count)." }
          if ($packages[0].Name -ne "Nefarius.Tools.DDG.$version.nupkg") {
            throw "Package $($packages[0].Name) does not match tag version $version."
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($packages[0].FullName)
          try {
            $names = $zip.Entries | ForEach-Object FullName
            foreach ($required in 'README.md', 'NSS-Vibe-128x128.png') {
              if ($names -notcontains $required) { throw "$required missing from package." }
            }
            $settings = $names | Where-Object { $_ -like 'tools/net10.0/any/DotnetToolSettings.xml' }
            if (-not $settings) { throw 'DotnetToolSettings.xml missing from package.' }
          } finally { $zip.Dispose() }

      - name: NuGet login (OIDC -> temp API key)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: Nefarius

      - name: Push to nuget.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          # dotnet nuget push also uploads the matching .snupkg next to each .nupkg.
          foreach ($package in Get-ChildItem ./artifacts/nupkg -Filter '*.nupkg') {
            dotnet nuget push $package.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "Push failed for $($package.Name)." }
          }

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-packages
          path: ./artifacts/nupkg/*

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-packages
          path: ./artifacts/nupkg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            artifacts/nupkg/*.nupkg
            artifacts/nupkg/*.snupkg
